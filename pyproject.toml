[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docintel"
version = "1.0.0"
description = "DocIntel AI: grounded question answering, summarization, extraction and comparison over uploaded PDFs (AAI-530 final project)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "AAI-530 team: Robert, Josue, Marie" }]
# Lower bounds reflect the major versions this project was actually tested with
# (see requirements-lock.txt for the exact tested environment).
dependencies = [
    "streamlit>=1.60,<2",
    "pymupdf>=2.0,<3",
    "pydantic>=2.10,<3",
    "python-dotenv>=1.0,<2",
    "openai>=3.0,<4",
]

[project.optional-dependencies]
anthropic = ["anthropic>=2.0,<3"]
gemini = ["google-genai>=3.0,<4"]
dev = ["pytest>=8", "ruff>=0.6"]
all = ["anthropic>=2.0,<3", "google-genai>=3.0,<4", "pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # PyMuPDF's SWIG bindings emit these on Python 3.14; they are harmless.
    "ignore:builtin type Swig:DeprecationWarning",
    "ignore:builtin type swigvarlink:DeprecationWarning",
]
markers = [
    "live: calls a real, paid LLM API (skipped unless DOCINTEL_RUN_LIVE_TESTS=1 and a key is configured)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",    # line length is enforced by `ruff format`; remaining long lines are string literals
    "RUF001",  # ambiguous unicode in strings: we intentionally use typographic characters in text fixtures
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
