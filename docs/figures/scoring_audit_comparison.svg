<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 904 328" width="904" height="328" role="img" aria-labelledby="t d">
<title id="t">What the scoring audit changes</title>
<desc id="d">Dumbbell chart. Injection resistance, original to revised: offline 75% to 75%, prompt v1 75% to 100%, prompt v2 100% to 100%, prompt v2 three repeats 83% to 100%. Conflict handling: offline 0% to 0%, v1 33% to 33%, v2 33% to 67%, v2 three repeats 44% to 78%.</desc>
<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781; --grid:#e1e0d9;
        --axis:#c3c2b7; --series:#2a78d6; --pass:#cde2fb; --fail:#d03b3b; --warn:#fab219; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781; --grid:#2c2c2a;
          --axis:#383835; --series:#3987e5; --pass:#184f95; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
  .title { font-size: 17px; font-weight: 600; }
  .sub { font-size: 13px; fill: var(--ink2); }
  .label { font-size: 13px; }
  .small { font-size: 12px; fill: var(--ink2); }
  .num { font-variant-numeric: tabular-nums; }
</style>
<rect width="904" height="328" rx="8" fill="var(--surface)"/>
<text x="24.0" y="32.0" class="title" text-anchor="start">What the scoring audit changes</text>
<text x="24.0" y="52.0" class="sub" text-anchor="start">Same saved answers, scored by the original rules and by the revised (proposed) rules.</text>
<text x="180.0" y="121.0" class="label" text-anchor="end">Offline baseline</text>
<text x="180.0" y="155.0" class="label" text-anchor="end">Prompt v1</text>
<text x="180.0" y="189.0" class="label" text-anchor="end">Prompt v2</text>
<text x="180.0" y="223.0" class="label" text-anchor="end">Prompt v2, 3 repeats</text>
<text x="194.0" y="86.0" class="label" text-anchor="start">Injection resistance</text>
<line x1="194.0" y1="100" x2="194.0" y2="232" stroke="var(--grid)" stroke-width="1"/>
<text x="194.0" y="250.0" class="small num" text-anchor="middle">0%</text>
<line x1="269.0" y1="100" x2="269.0" y2="232" stroke="var(--grid)" stroke-width="1"/>
<text x="269.0" y="250.0" class="small num" text-anchor="middle">25%</text>
<line x1="344.0" y1="100" x2="344.0" y2="232" stroke="var(--grid)" stroke-width="1"/>
<text x="344.0" y="250.0" class="small num" text-anchor="middle">50%</text>
<line x1="419.0" y1="100" x2="419.0" y2="232" stroke="var(--grid)" stroke-width="1"/>
<text x="419.0" y="250.0" class="small num" text-anchor="middle">75%</text>
<line x1="494.0" y1="100" x2="494.0" y2="232" stroke="var(--grid)" stroke-width="1"/>
<text x="494.0" y="250.0" class="small num" text-anchor="middle">100%</text>
<circle cx="419.0" cy="116" r="7" fill="var(--surface)" stroke="var(--ink2)" stroke-width="2"><title>Offline baseline, Injection resistance, original: 75%</title></circle>
<circle cx="419.0" cy="116" r="5" fill="var(--series)" stroke="var(--surface)" stroke-width="2"><title>Offline baseline, Injection resistance, revised: 75%</title></circle>
<line x1="419.0" y1="150" x2="494.0" y2="150" stroke="var(--series)" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
<circle cx="419.0" cy="150" r="7" fill="var(--surface)" stroke="var(--ink2)" stroke-width="2"><title>Prompt v1, Injection resistance, original: 75%</title></circle>
<circle cx="494.0" cy="150" r="5" fill="var(--series)" stroke="var(--surface)" stroke-width="2"><title>Prompt v1, Injection resistance, revised: 100%</title></circle>
<text x="500.0" y="140.0" class="small num" text-anchor="end">75% to 100%</text>
<circle cx="494.0" cy="184" r="7" fill="var(--surface)" stroke="var(--ink2)" stroke-width="2"><title>Prompt v2, Injection resistance, original: 100%</title></circle>
<circle cx="494.0" cy="184" r="5" fill="var(--series)" stroke="var(--surface)" stroke-width="2"><title>Prompt v2, Injection resistance, revised: 100%</title></circle>
<line x1="443.9" y1="218" x2="494.0" y2="218" stroke="var(--series)" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
<circle cx="443.9" cy="218" r="7" fill="var(--surface)" stroke="var(--ink2)" stroke-width="2"><title>Prompt v2, 3 repeats, Injection resistance, original: 83%</title></circle>
<circle cx="494.0" cy="218" r="5" fill="var(--series)" stroke="var(--surface)" stroke-width="2"><title>Prompt v2, 3 repeats, Injection resistance, revised: 100%</title></circle>
<text x="500.0" y="208.0" class="small num" text-anchor="end">83% to 100%</text>
<text x="564.0" y="86.0" class="label" text-anchor="start">Conflict handling</text>
<line x1="564.0" y1="100" x2="564.0" y2="232" stroke="var(--grid)" stroke-width="1"/>
<text x="564.0" y="250.0" class="small num" text-anchor="middle">0%</text>
<line x1="639.0" y1="100" x2="639.0" y2="232" stroke="var(--grid)" stroke-width="1"/>
<text x="639.0" y="250.0" class="small num" text-anchor="middle">25%</text>
<line x1="714.0" y1="100" x2="714.0" y2="232" stroke="var(--grid)" stroke-width="1"/>
<text x="714.0" y="250.0" class="small num" text-anchor="middle">50%</text>
<line x1="789.0" y1="100" x2="789.0" y2="232" stroke="var(--grid)" stroke-width="1"/>
<text x="789.0" y="250.0" class="small num" text-anchor="middle">75%</text>
<line x1="864.0" y1="100" x2="864.0" y2="232" stroke="var(--grid)" stroke-width="1"/>
<text x="864.0" y="250.0" class="small num" text-anchor="middle">100%</text>
<circle cx="564.0" cy="116" r="7" fill="var(--surface)" stroke="var(--ink2)" stroke-width="2"><title>Offline baseline, Conflict handling, original: 0%</title></circle>
<circle cx="564.0" cy="116" r="5" fill="var(--series)" stroke="var(--surface)" stroke-width="2"><title>Offline baseline, Conflict handling, revised: 0%</title></circle>
<circle cx="663.9" cy="150" r="7" fill="var(--surface)" stroke="var(--ink2)" stroke-width="2"><title>Prompt v1, Conflict handling, original: 33%</title></circle>
<circle cx="663.9" cy="150" r="5" fill="var(--series)" stroke="var(--surface)" stroke-width="2"><title>Prompt v1, Conflict handling, revised: 33%</title></circle>
<line x1="663.9" y1="184" x2="764.1" y2="184" stroke="var(--series)" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
<circle cx="663.9" cy="184" r="7" fill="var(--surface)" stroke="var(--ink2)" stroke-width="2"><title>Prompt v2, Conflict handling, original: 33%</title></circle>
<circle cx="764.1" cy="184" r="5" fill="var(--series)" stroke="var(--surface)" stroke-width="2"><title>Prompt v2, Conflict handling, revised: 67%</title></circle>
<text x="778.1" y="174.0" class="small num" text-anchor="start">33% to 67%</text>
<line x1="697.2" y1="218" x2="797.4" y2="218" stroke="var(--series)" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
<circle cx="697.2" cy="218" r="7" fill="var(--surface)" stroke="var(--ink2)" stroke-width="2"><title>Prompt v2, 3 repeats, Conflict handling, original: 44%</title></circle>
<circle cx="797.4" cy="218" r="5" fill="var(--series)" stroke="var(--surface)" stroke-width="2"><title>Prompt v2, 3 repeats, Conflict handling, revised: 78%</title></circle>
<text x="811.4" y="208.0" class="small num" text-anchor="start">44% to 78%</text>
<circle cx="31" cy="280" r="7" fill="var(--surface)" stroke="var(--ink2)" stroke-width="2"/>
<text x="46.0" y="284.0" class="label" text-anchor="start">Original scoring (scorer of record)</text>
<circle cx="331" cy="280" r="5" fill="var(--series)" stroke="var(--surface)" stroke-width="2"/>
<text x="344.0" y="284.0" class="label" text-anchor="start">Revised scoring (proposed; not yet adopted)</text>
<text x="24.0" y="310.0" class="small" text-anchor="start">Injection: 4 cases per run (12 for 3 repeats). Conflict: 3 cases per run (9).</text>
</svg>
